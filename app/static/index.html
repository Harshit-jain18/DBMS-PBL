<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airline Operations Console</title>
<style>
:root{--paper:#EDF0F3;--panel:#fff;--ink:#17212B;--mute:#5A6773;--line:#D4DAE0;--board:#10171E;--amber:#FFC21A;--blue:#245FA8;--ok:#1B8A78;--bad:#C93C3C;--warn:#B7791F;
 --sans:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;--mono:"Consolas","SFMono-Regular","Menlo",monospace}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--ink);color:#C9D3DC;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
nav h1{font-size:17px;color:#fff;margin:0 8px 18px;line-height:1.25;font-weight:600}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;font-size:14.5px}
nav button:hover{background:#25323E}nav button[aria-current=true]{background:var(--amber);color:var(--ink);font-weight:600}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav .sp{flex:1}nav small{display:block;margin:6px 10px;color:#8796A3;font-size:12px}
main{padding:26px 32px 60px;max-width:1180px;width:100%}
h2{font-size:24px;margin:0 0 4px;font-weight:600}h3{font-size:16px;margin:22px 0 8px;font-weight:600}
.lede{color:var(--mute);margin:0 0 18px;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.board{background:var(--board);border-radius:6px;padding:6px 0;margin-bottom:18px;overflow-x:auto}
.board table{width:100%;border-collapse:collapse;font-family:var(--mono);color:var(--amber);font-size:15px;letter-spacing:.04em}
.board th{color:#8E7A32;font-weight:400;text-align:left;padding:8px 14px;font-size:12.5px;border-bottom:1px solid #26323D}
.board td{padding:11px 14px;border-bottom:1px solid #1B252E;white-space:nowrap}
.board tr:last-child td{border:0}.board .st{color:#7EE0C4}.board .st.DELAYED{color:#FF9A57}.board .st.CANCELLED{color:#FF6B6B}
.tiles{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 16px}.tiles div{min-width:90px}.tiles b{display:block;font-size:26px;font-weight:600;line-height:1.1}.tiles span{color:var(--mute);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{text-align:left;background:#F3F5F7;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid #E7EBEF;vertical-align:top}.scroll{overflow-x:auto}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #B9C2CA;border-radius:5px;background:#fff;width:100%}
textarea{font-family:var(--mono);font-size:13.5px;min-height:84px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
button.b{font:inherit;font-weight:600;padding:8px 14px;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.b:hover{background:#2B3947}button.b.alt{background:#fff;color:var(--ink)}button.b.alt:hover{background:#EEF1F4}
button.b.sm{padding:3px 9px;font-size:13px}button.b:disabled{opacity:.4;cursor:not-allowed}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps span{padding:5px 12px;border-radius:99px;background:#DCE2E8;font-size:13.5px}.steps .on{background:var(--amber);font-weight:600}.steps .done{background:#BFE6DC}
.seats{display:grid;grid-template-columns:repeat(4,64px);gap:8px;margin:10px 0}
.seat{all:unset;cursor:pointer;text-align:center;padding:9px 0;border:1.5px solid var(--ok);border-radius:6px;font-weight:600;background:#fff}
.seat small{display:block;font-weight:400;font-size:11px;color:var(--mute)}.seat.LOCKED{border-color:#B9C2CA;background:#E4E8EC;color:#8793A0;cursor:not-allowed}
.seat.sel{background:var(--ok);color:#fff}.seat.sel small{color:#DFF4EE}.seat:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.flt{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer;background:#fff}
.flt.sel{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12.5px;font-weight:600;background:#E4E8EC}
.tag.PASS,.tag.CONFIRMED,.tag.VERIFIED,.tag.AVAILABLE{background:#CDEFE6;color:#0F5E50}.tag.FAIL,.tag.CANCELLED,.tag.REJECTED{background:#F7D3D3;color:#8E2424}.tag.HOLD,.tag.PENDING{background:#FBE8BF;color:#7A5410}
.log{font-family:var(--mono);font-size:13px;background:#F6F8FA;border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-height:230px;overflow:auto;white-space:pre-wrap}
.log .ok{color:var(--ok)}.log .no{color:var(--bad)}
pre.sql{font-family:var(--mono);font-size:13px;background:var(--board);color:#D7E3EE;padding:12px 14px;border-radius:6px;overflow:auto;margin:8px 0;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.chips button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid #B9C2CA;border-radius:99px;background:#fff;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--mute);padding:14px 4px}
@media(max-width:820px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}nav h1{width:100%;margin-bottom:6px}nav .sp,nav small{display:none}main{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<nav aria-label="Sections"><h1>Airline operations console</h1>
 <button data-p="board">Departures</button><button data-p="book">Book a trip</button><button data-p="bookings">Bookings</button>
 <button data-p="data">Tables and views</button><button data-p="queries">Queries</button><button data-p="rules">Rules and errors</button><button data-p="tests">Test matrix</button>
 <div class="sp"></div><small>MySQL design, SQLite runtime. Every action goes through the REST API.</small><button id="reset">Reset demo data</button></nav>
<main id="m" tabindex="-1"></main>
<script>
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(m,p,b){try{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});return{s:r.status,d:await r.json()}}catch(e){return{s:0,d:{error:'Server unreachable. Is server.py running?'}}}}
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const TAGS=['status','verification','state','checkin'];
function table(rows,opts={}){if(!rows||!rows.length)return'<div class="empty">No rows.</div>';const cols=Object.keys(rows[0]);
 return'<div class="scroll"><table class="t"><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+(opts.actions?'<th></th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>{const v=r[c];return'<td>'+(TAGS.includes(c)&&v?`<span class="tag ${esc(v)}">${esc(v)}</span>`:esc(v))+'</td>'}).join('')+(opts.actions?`<td>${opts.actions(r)}</td>`:'')+'</tr>').join('')+'</tbody></table></div>'}
function logLine(el,m,p,res){const ok=res.s>=200&&res.s<300;el.insertAdjacentHTML('afterbegin',`<div class="${ok?'ok':'no'}">${esc(m)} ${esc(p)}  →  ${res.s} ${esc(res.d&&res.d.error?res.d.error:JSON.stringify(res.d).slice(0,160))}</div>`)}
const pages={};let cur='board';
function go(p){cur=p;document.querySelectorAll('nav [data-p]').forEach(b=>b.setAttribute('aria-current',b.dataset.p===p));pages[p]()}
document.querySelectorAll('nav [data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('#reset').onclick=async()=>{if(confirm('Restore the demo data set? Your changes will be lost.')){await api('POST','/api/reset',{});go(cur)}};

pages.board=async()=>{const [s,f,rv]=await Promise.all([api('GET','/api/summary'),api('GET','/api/flights'),api('GET','/api/views/v_revenue_summary')]);
 const rev={};(rv.d||[]).forEach(r=>rev[r.flight_id]=r);const S=s.d;
 $('#m').innerHTML=`<h2>Departures</h2><p class="lede">Live view of scheduled flights, seats left and revenue taken, read from the database views.</p>
 <div class="tiles"><div><b>${S.flights}</b><span>flights</span></div><div><b>${S.passengers}</b><span>passengers</span></div><div><b>${S.bookings}</b><span>bookings</span></div><div><b>${S.confirmed}</b><span>confirmed</span></div><div><b>${money(S.revenue)}</b><span>revenue</span></div></div>
 <div class="board"><table><thead><tr><th>Flight</th><th>From</th><th>To</th><th>Departs</th><th>Seats left</th><th>Load</th><th>Revenue</th><th>Status</th></tr></thead><tbody>`+
 (f.d||[]).map(r=>`<tr><td>${esc(r.flight_no)}</td><td>${esc(r.origin_city)}</td><td>${esc(r.dest_city)}</td><td>${esc(r.dep_time.slice(5))}</td><td>${r.open_seats}/${r.total_seats}</td><td>${rev[r.flight_id]?rev[r.flight_id].load_pct+'%':''}</td><td>${money(rev[r.flight_id]?.revenue)}</td><td class="st ${esc(r.status)}">${esc(r.status)}</td></tr>`).join('')+`</tbody></table></div>
 <div class="panel"><h3 style="margin-top:0">Add a flight</h3><p class="lede">Try scheduling an aircraft over an existing flight. The overlap trigger will refuse it.</p>
 <div class="row"><div><label>Flight no</label><input id="nf_no" value="AI301"></div><div><label>From</label><input id="nf_o" value="HYD"></div><div><label>To</label><input id="nf_d" value="BOM"></div><div><label>Aircraft id</label><input id="nf_a" value="1"></div></div>
 <div class="row"><div><label>Departs</label><input id="nf_dep" value="2026-11-10 07:00"></div><div><label>Arrives</label><input id="nf_arr" value="2026-11-10 09:00"></div><div><label>Base fare</label><input id="nf_f" value="5200"></div></div>
 <button class="b" id="nf_go">Add flight</button><div class="log" id="nf_log" style="margin-top:10px" aria-live="polite"></div></div>`;
 $('#nf_go').onclick=async()=>{const b={flight_no:$('#nf_no').value,origin_code:$('#nf_o').value,dest_code:$('#nf_d').value,aircraft_id:$('#nf_a').value,dep_time:$('#nf_dep').value,arr_time:$('#nf_arr').value,base_fare:$('#nf_f').value};const r=await api('POST','/api/flights',b);logLine($('#nf_log'),'POST','/api/flights',r);if(r.s==201)setTimeout(()=>go('board'),900)}};

pages.book=async()=>{const st={step:1,pid:null,fid:null,sid:null,bid:null,fare:0,pass:null,seats:[]};
 const m=$('#m');m.innerHTML=`<h2>Book a trip</h2><p class="lede">One passenger, from intake to a confirmed ticket. Each step calls the API and the database rules decide whether it succeeds.</p>
 <div class="steps" id="stp"></div><div class="panel" id="stage"></div><h3>API activity</h3><div class="log" id="lg" aria-live="polite"></div>`;
 const L=(mm,pp,r)=>logLine($('#lg'),mm,pp,r);
 const names=['Intake','Flight and seat','Verification','Seat check','Billing'];
 const draw=()=>{$('#stp').innerHTML=names.map((n,i)=>`<span class="${st.step==i+1?'on':st.step>i+1?'done':''}">${i+1}. ${n}</span>`).join('');stage()};
 const seatMap=(sel)=>`<div class="seats" role="group" aria-label="Seat map">`+st.seats.map(s=>`<button class="seat ${s.state} ${s.seat_id==sel?'sel':''}" data-id="${s.seat_id}" ${s.state=='LOCKED'&&s.seat_id!=sel?'disabled':''}>${esc(s.seat_no)}<small>${esc(s.class)}</small></button>`).join('')+`</div>`;
 const loadSeats=async()=>{const r=await api('GET','/api/flights/'+st.fid+'/seats');st.seats=r.d||[]};
 async function stage(){const g=$('#stage');
  if(st.step==1){const ex=await api('GET','/api/passengers');const rnd='P'+Math.floor(1000000+Math.random()*8999999);
   g.innerHTML=`<h3 style="margin-top:0">Passenger intake</h3><div class="row"><div><label>Full name</label><input id="f_n" value="Meera Joshi"></div><div><label>Email</label><input id="f_e" value="meera${Date.now()%10000}@mail.com"></div><div><label>Phone</label><input id="f_p" value="9811122233"></div><div><label>Passport</label><input id="f_pp" value="${rnd}"></div><div><label>Date of birth</label><input id="f_d" value="1997-03-21"></div></div>
   <button class="b" id="go1">Save passenger</button><h3>Or continue with an existing passenger</h3><div class="row"><div><select id="exs">`+(ex.d||[]).map(p=>`<option value="${p.passenger_id}">${esc(p.full_name)} (${esc(p.passport_no)})</option>`).join('')+`</select></div><div><button class="b alt" id="use">Use this passenger</button></div></div>`;
   $('#go1').onclick=async()=>{const b={full_name:$('#f_n').value,email:$('#f_e').value,phone:$('#f_p').value,passport_no:$('#f_pp').value,dob:$('#f_d').value};const r=await api('POST','/api/passengers',b);L('POST','/api/passengers',r);if(r.s==201){st.pid=r.d.passenger_id;st.step=2;draw()}};
   $('#use').onclick=()=>{st.pid=+$('#exs').value;st.step=2;draw()}}
  if(st.step==2){const r=await api('GET','/api/flights');
   g.innerHTML=`<h3 style="margin-top:0">Choose a flight</h3><div class="row"><div><label>From (code or city)</label><input id="s_f" placeholder="HYD"></div><div><label>To</label><input id="s_t" placeholder="Delhi"></div><div><label>Date</label><input id="s_d" placeholder="2026-11-10"></div><div style="align-self:end"><button class="b alt" id="srch">Search</button></div></div><div id="fl"></div><div id="sm"></div>`;
   const showF=(list)=>{$('#fl').innerHTML=list.length?list.map(f=>`<div class="flt ${f.flight_id==st.fid?'sel':''}" data-f="${f.flight_id}" tabindex="0" role="button"><span><b>${esc(f.flight_no)}</b> ${esc(f.origin_city)} to ${esc(f.dest_city)}, ${esc(f.dep_time)}</span><span>${f.open_seats} seats left, from ${money(f.base_fare)}</span></div>`).join(''):'<div class="empty">No flights match. Try fewer filters.</div>';
    document.querySelectorAll('.flt').forEach(e=>{const pick=async()=>{st.fid=+e.dataset.f;st.sid=null;await loadSeats();showF(list);showSeats()};e.onclick=pick;e.onkeydown=k=>{if(k.key=='Enter')pick()}})};
   const showSeats=()=>{if(!st.fid)return;$('#sm').innerHTML=`<h3>Pick a seat</h3>${seatMap(st.sid)}<p class="lede">Business seats cost 3x the base fare. Greyed seats are locked by another booking.</p><button class="b" id="hold" ${st.sid?'':'disabled'}>Hold seat</button>`;
    document.querySelectorAll('.seat').forEach(b=>b.onclick=()=>{st.sid=+b.dataset.id;showSeats()});
    $('#hold').onclick=async()=>{const x=await api('POST','/api/bookings',{passenger_id:st.pid,flight_id:st.fid,seat_id:st.sid});L('POST','/api/bookings',x);if(x.s==201){st.bid=x.d.booking_id;st.fare=x.d.fare;st.step=3;draw()}else{await loadSeats();showSeats()}}};
   showF(r.d||[]);$('#srch').onclick=async()=>{const q=new URLSearchParams({from:$('#s_f').value,to:$('#s_t').value,date:$('#s_d').value});const x=await api('GET','/api/flights?'+q);if(x.s==200)showF(x.d);else L('GET','/api/flights',x)}}
  if(st.step==3){g.innerHTML=`<h3 style="margin-top:0">Document and fare verification</h3><p class="lede">Booking ${st.bid} is on hold at ${money(st.fare)}. Staff confirm the passport and fare before any payment is accepted.</p><button class="b" id="ver">Mark verified</button> <button class="b alt" id="rej">Reject</button>`;
   const vf=res=>async()=>{const r=await api('POST','/api/bookings/'+st.bid+'/verify',{result:res});L('POST','/api/bookings/'+st.bid+'/verify',r);if(r.s==200&&res=='VERIFIED'){st.step=4;draw()}};$('#ver').onclick=vf('VERIFIED');$('#rej').onclick=vf('REJECTED')}
  if(st.step==4){await loadSeats();const cb=(await api('GET','/api/bookings')).d.find(b=>b.booking_id==st.bid);
   g.innerHTML=`<h3 style="margin-top:0">Seat check</h3><p class="lede">Keep the current seat or move to another one before paying. The seat lock trigger protects every change.</p>${seatMap(st.sid)}<button class="b" id="keep">Keep seat and continue</button>`;
   document.querySelectorAll('.seat').forEach(b=>b.onclick=async()=>{const r=await api('PUT','/api/bookings/'+st.bid+'/seat',{seat_id:+b.dataset.id});L('PUT','/api/bookings/'+st.bid+'/seat',r);if(r.s==200){st.sid=r.d.seat_id;st.fare=r.d.fare;draw()}});$('#keep').onclick=()=>{st.step=5;draw()}}
  if(st.step==5){g.innerHTML=`<h3 style="margin-top:0">Billing</h3><div class="row"><div><label>Amount (fare is ${money(st.fare)})</label><input id="amt" value="${st.fare}"></div><div><label>Method</label><select id="mth"><option>CARD</option><option>UPI</option><option>NETBANKING</option><option>CASH</option></select></div></div><button class="b" id="pay">Pay</button><p class="lede" style="margin-top:10px">Try an amount below the fare first. The payment trigger will refuse it.</p><div id="after"></div>`;
   $('#pay').onclick=async()=>{const r=await api('POST','/api/payments',{booking_id:st.bid,amount:$('#amt').value,method:$('#mth').value});L('POST','/api/payments',r);if(r.s==201){$('#pay').disabled=true;$('#after').innerHTML=`<h3>Booking ${st.bid} is <span class="tag CONFIRMED">CONFIRMED</span></h3><button class="b alt" id="ci">Check in</button> <button class="b alt" id="bg">Add 25 kg bag</button> <button class="b" id="again">Book another trip</button>`;
    $('#ci').onclick=async()=>{const x=await api('POST','/api/checkin',{booking_id:st.bid,gate_no:'B4'});L('POST','/api/checkin',x)};$('#bg').onclick=async()=>{const x=await api('POST','/api/baggage',{booking_id:st.bid,weight_kg:25});L('POST','/api/baggage',x)};$('#again').onclick=()=>go('book')}}}
 }
 draw()};

pages.bookings=async()=>{const r=await api('GET','/api/bookings');
 $('#m').innerHTML=`<h2>Bookings</h2><p class="lede">Verify, cancel, check in or tag baggage. Cancelling frees the seat and refunds any payment.</p><div class="panel">${table(r.d,{actions:b=>b.status=='CANCELLED'?'':`<button class="b sm alt" data-a="ver" data-id="${b.booking_id}">Verify</button> <button class="b sm alt" data-a="ci" data-id="${b.booking_id}">Check in</button> <button class="b sm alt" data-a="bg" data-id="${b.booking_id}">Bag</button> <button class="b sm" data-a="x" data-id="${b.booking_id}">Cancel</button>`})}</div><div class="log" id="lg" aria-live="polite"></div>`;
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,a=b.dataset.a;let x,p;
  if(a=='ver'){p='/api/bookings/'+id+'/verify';x=await api('POST',p,{result:'VERIFIED'})}
  if(a=='ci'){p='/api/checkin';x=await api('POST',p,{booking_id:+id,gate_no:'B4'})}
  if(a=='bg'){const w=prompt('Bag weight in kg (up to 50)','22');if(!w)return;p='/api/baggage';x=await api('POST',p,{booking_id:+id,weight_kg:w})}
  if(a=='x'){if(!confirm('Cancel booking '+id+'?'))return;p='/api/bookings/'+id;x=await api('DELETE',p,{})}
  logLine($('#lg'),a=='x'?'DELETE':'POST',p,x);if(a=='x'||a=='ver'||a=='ci')setTimeout(()=>go('bookings'),700)})};

pages.data=async()=>{const [t,v]=await Promise.all([api('GET','/api/tables'),api('GET','/api/views')]);
 $('#m').innerHTML=`<h2>Tables and views</h2><p class="lede">The 12 tables (9 core, 3 extension) and the 5 reporting views.</p><div class="chips" id="ch">`+t.d.map(x=>`<button data-k="t" data-n="${x.name}">${x.name}</button>`).join('')+v.d.map(x=>`<button data-k="v" data-n="${x}">${x}</button>`).join('')+`</div><div class="panel" id="out"><div class="empty">Choose a table or view.</div></div>`;
 document.querySelectorAll('#ch button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('#ch button').forEach(x=>x.setAttribute('aria-pressed',x===b));const r=await api('GET',(b.dataset.k=='t'?'/api/tables/':'/api/views/')+b.dataset.n);$('#out').innerHTML=r.s==200?table(r.d):esc(r.d.error)})};

pages.queries=async()=>{const q=await api('GET','/api/queries');
 $('#m').innerHTML=`<h2>Queries</h2><p class="lede">The 14 demonstration queries: joins, subqueries and aggregates.</p><div class="chips" id="qc">`+q.d.map(x=>`<button data-id="${x.id}" title="${esc(x.title)}">${x.id}</button>`).join('')+`</div><div class="panel" id="qo"><div class="empty">Choose a query.</div></div>
 <h3>SQL console (read only)</h3><textarea id="sq" spellcheck="false">SELECT class, COUNT(*) AS seats FROM seat GROUP BY class</textarea><p><button class="b" id="run">Run query</button></p><div class="panel" id="so"></div>`;
 document.querySelectorAll('#qc button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('#qc button').forEach(x=>x.setAttribute('aria-pressed',x===b));const d=q.d.find(x=>x.id==b.dataset.id),r=await api('GET','/api/queries/'+d.id);
  $('#qo').innerHTML=`<b>${d.id}</b> ${esc(d.kind)}: ${esc(d.title)}<pre class="sql">${esc(d.sql)}</pre>${table(r.d)}`});
 $('#run').onclick=async()=>{const r=await api('POST','/api/sql',{sql:$('#sq').value});$('#so').innerHTML=r.s==200?table(r.d.rows):`<span class="tag FAIL">${r.s}</span> ${esc(r.d.error)}`}};

pages.rules=async()=>{const t=await api('GET','/api/triggers');
 const demos=[['Missing seat_id','POST','/api/bookings',{passenger_id:1,flight_id:101},'API validation'],['Unknown flight 9999','POST','/api/bookings',{passenger_id:1,flight_id:9999,seat_id:1},'API existence check'],
  ['Book a seat that is taken','POST','/api/bookings',{passenger_id:4,flight_id:101,seat_id:1},'Seat lock trigger'],['Seat from a different aircraft','POST','/api/bookings',{passenger_id:4,flight_id:101,seat_id:9},'Seat ownership trigger'],
  ['Overlapping flight on aircraft 1','POST','/api/flights',{flight_no:'ZZ9',origin_code:'HYD',dest_code:'BOM',aircraft_id:1,dep_time:'2026-11-10 07:00',arr_time:'2026-11-10 09:00',base_fare:900},'Overlap trigger'],
  ['Pay before verification','POST','/api/payments',{booking_id:3,amount:4500,method:'UPI'},'API business rule'],['Duplicate passport','POST','/api/passengers',{full_name:'Copy Cat',email:'copy@mail.com',phone:'9000000001',passport_no:'P1234567',dob:'1990-01-01'},'UNIQUE constraint'],
  ['Delete passenger with bookings','DELETE','/api/passengers/1',{},'Foreign key'],['Bad email address','POST','/api/passengers',{full_name:'X Y',email:'nope',phone:'9000000002',passport_no:'ZZ123456',dob:'1990-01-01'},'API validation'],
  ['Search with SQL injection text','GET','/api/flights?from='+encodeURIComponent("' OR 1=1 --"),undefined,'Parameterised query']];
 $('#m').innerHTML=`<h2>Rules and errors</h2><p class="lede">Business rules live in the database as triggers. Run each bad request below and see which layer stops it. Nothing here changes your data.</p>
 <div class="panel"><table class="t"><thead><tr><th>Bad request</th><th>Caught by</th><th>Result</th><th></th></tr></thead><tbody>`+demos.map((d,i)=>`<tr><td>${esc(d[0])}</td><td>${esc(d[4])}</td><td id="dr${i}"></td><td><button class="b sm alt" data-i="${i}">Run</button></td></tr>`).join('')+`</tbody></table></div>
 <h3>Triggers in the database</h3>`+t.d.map(x=>`<details class="panel" style="padding:10px 14px"><summary><b>${esc(x.name)}</b> on ${esc(x.on_table)}</summary><pre class="sql">${esc(x.sql)}</pre></details>`).join('');
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{const d=demos[b.dataset.i],r=await api(d[1],d[2],d[3]);const ok=r.s>=200&&r.s<300;$('#dr'+b.dataset.i).innerHTML=`<span class="tag ${ok?'PASS':'FAIL'}">${r.s}</span> ${esc(r.d.error||(Array.isArray(r.d)?r.d.length+' rows, nothing leaked':JSON.stringify(r.d)))}`})};

pages.tests=async()=>{$('#m').innerHTML=`<h2>Test matrix</h2><p class="lede">Ten tests run against a fresh in-memory copy of the database, so your live data is never touched.</p><button class="b" id="rt">Run all 10 tests</button><div class="panel" id="to" style="margin-top:14px"><div class="empty">Not run yet.</div></div>`;
 $('#rt').onclick=async()=>{$('#to').innerHTML='Running...';const r=await api('POST','/api/tests/run',{});const n=r.d.filter(x=>x.passed).length;
  $('#to').innerHTML=`<p><b>${n} of ${r.d.length} passed</b></p><div class="scroll"><table class="t"><thead><tr><th>#</th><th>Test</th><th>Action</th><th>Expected</th><th>HTTP</th><th>Actual</th><th>Status</th></tr></thead><tbody>`+r.d.map(x=>`<tr><td>${x.n}</td><td>${esc(x.test)}</td><td>${esc(x.action)}</td><td>${esc(x.expected)}</td><td>${x.http}</td><td>${esc(x.actual)}</td><td><span class="tag ${x.passed?'PASS':'FAIL'}">${x.passed?'PASS':'FAIL'}</span></td></tr>`).join('')+`</tbody></table></div>`}};
go('board');
</script></body></html>
